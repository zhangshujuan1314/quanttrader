version: "3.8"

services:
  app:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - QT_DATABASE_URL=postgresql+asyncpg://quant:quant@db:5432/quanttrader
      - QT_REDIS_URL=redis://redis:6379
      - QT_DEBUG=false
      - QT_JWT_SECRET=${QT_JWT_SECRET:?Set QT_JWT_SECRET to a strong random value before starting Docker Compose}
      - QT_ALLOW_UNSAFE_STRATEGY_EXEC=false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  db:
    image: timescale/timescaledb:2.15-pg15
    environment:
      POSTGRES_USER: quant
      POSTGRES_PASSWORD: quant
      POSTGRES_DB: quanttrader
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant -d quanttrader"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
    command: npm run dev -- --host 0.0.0.0

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
      - frontend

volumes:
  pgdata:
