[tool.poetry]
name = "quanttrader"
version = "0.1.0"
description = "量化智投 - 一站式股票量化交易平台"
authors = ["QuantTrader Team"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111"
uvicorn = {extras = ["standard"], version = "^0.30"}
asyncpg = "^0.29"
aiosqlite = "^0.20"
psycopg2-binary = "^2.9"
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
alembic = "^1.13"
redis = "^5.0"
apscheduler = "^3.10"
backtrader = "^1.9"
akshare = "^1.14"
empyrical-reloaded = "^0.5"
pandas = "^2.2"
numpy = "^1.26"
pydantic = "^2.7"
pydantic-settings = "^2.3"
python-multipart = "^0.0.9"
websockets = "^12.0"
passlib = {extras = ["argon2"], version = "^1.7"}
pyjwt = "^2.8"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
httpx = "^0.27"
ruff = "^0.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
